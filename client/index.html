<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DIL & DATA — a personal publishing platform."
    />
    <title>DIL &amp; DATA</title>
    <link
      rel="preload"
      as="image"
      href="/dupatta.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <script>
      (function () {
        var base = "%VITE_API_URL%" || "http://localhost:5050/api";
        if (base.indexOf("%") === 0) base = "http://localhost:5050/api";
        try {
          var origin = new URL(base).origin;
          var link = document.createElement("link");
          link.rel = "preconnect";
          link.href = origin;
          document.head.appendChild(link);
        } catch (e) {}
        fetch(String(base).replace(/\/$/, "") + "/health", {
          cache: "no-store",
          mode: "cors",
          credentials: "omit",
        }).catch(function () {});
      })();
    </script>

    <!-- Google Fonts: Cinzel, Playfair Display, Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
