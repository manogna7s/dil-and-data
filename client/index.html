<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <meta name="theme-color" content="#f7f2ef" />
    <link rel="canonical" href="https://www.dilanddata.in/" />
    <title>DIL &amp; DATA | Stories, Travel, Culture &amp; Ideas</title>
    <link
      rel="preload"
      as="image"
      href="/dabba-closed.png?v=solid"
      fetchpriority="high"
    />

    <script>
      (function () {
        var api = "/api";
        if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
          api = "/api";
        }

        function setMeta(name, content) {
          if (!content) return;
          var el = document.querySelector('meta[name="' + name + '"]');
          if (!el) {
            el = document.createElement("meta");
            el.setAttribute("name", name);
            document.head.appendChild(el);
          }
          el.setAttribute("content", content);
        }

        function setOg(prop, content) {
          if (!content) return;
          var el = document.querySelector('meta[property="' + prop + '"]');
          if (!el) {
            el = document.createElement("meta");
            el.setAttribute("property", prop);
            document.head.appendChild(el);
          }
          el.setAttribute("content", content);
        }

        function setTwitter(name, content) {
          if (!content) return;
          var el = document.querySelector('meta[name="' + name + '"]');
          if (!el) {
            el = document.createElement("meta");
            el.setAttribute("name", name);
            document.head.appendChild(el);
          }
          el.setAttribute("content", content);
        }

        function applySeoFromSettings(seo) {
          if (!seo) return;
          var title =
            seo.title || "DIL & DATA | Stories, Travel, Culture & Ideas";
          document.title = title;
          var desc =
            seo.description ||
            "DIL & DATA is an independent personal publication exploring stories, travel, culture, books, people, and the quietly ridiculous details of everyday life.";
          setMeta("description", desc);
          if (seo.robots) setMeta("robots", seo.robots);
          var base = (seo.canonicalBase || "https://www.dilanddata.in").replace(/\/$/, "");
          if (base.indexOf("http") !== 0) base = "https://" + base;
          var canon = base + (location.pathname || "/");
          var link = document.querySelector('link[rel="canonical"]');
          if (!link) {
            link = document.createElement("link");
            link.rel = "canonical";
            document.head.appendChild(link);
          }
          link.href = canon;
          setOg("og:url", canon);
          var ogTitle = seo.ogTitle || title;
          var ogDesc = seo.ogDescription || desc;
          var ogImage = seo.ogImage || seo.image;
          if (ogTitle) setOg("og:title", ogTitle);
          if (ogDesc) setOg("og:description", ogDesc);
          if (ogImage) {
            setOg("og:image", ogImage);
            setTwitter("twitter:image", ogImage);
          }
          setOg("og:type", "website");
          setOg("og:site_name", "DIL & DATA");
          if (ogTitle) setTwitter("twitter:title", ogTitle);
          if (ogDesc) setTwitter("twitter:description", ogDesc);
          setTwitter("twitter:card", seo.twitterCard || "summary_large_image");
        }

        try {
          var xhr = new XMLHttpRequest();
          xhr.open("GET", api + "/settings", false);
          xhr.send(null);
          if (xhr.status >= 200 && xhr.status < 300) {
            var res = JSON.parse(xhr.responseText);
            applySeoFromSettings(res && res.data && res.data.seoDefaults);
          }
        } catch (e) {}

        fetch(api + "/health", { cache: "no-store", credentials: "omit" }).catch(function () {});
      })();
    </script>

    <!-- Google Fonts: Cinzel, Playfair Display, Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Reenie+Beanie&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
